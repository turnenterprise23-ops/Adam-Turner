services:
  - type: web
    name: last-man-standing
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/data/lastmanstanding.db
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/data
      sizeGB: 1
